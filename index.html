<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Form đăng ký người dùng</title>

    <style>
      body {
        font-family: Arial, sans-serif;
        background-color: #f0f2f5;
        margin: 0;
        padding: 40px 15px;
      }

      .container {
        width: 100%;
        max-width: 450px;
        margin: auto;
        padding: 25px;
        box-sizing: border-box;
        background-color: white;
        border-radius: 10px;
        box-shadow: 0 4px 12px #0000001a;
      }

      h2 {
        text-align: center;
        color: #2563eb;
        margin-bottom: 25px;
      }

      .form-group {
        margin-bottom: 18px;
      }

      .form-group > label {
        display: block;
        margin-bottom: 7px;
        font-weight: bold;
        color: #333333;
      }

      input[type="text"],
      input[type="email"],
      input[type="tel"] {
        width: 100%;
        box-sizing: border-box;
        padding: 11px;
        border: 1px solid #cccccc;
        border-radius: 5px;
        font-size: 15px;
      }

      .gender label {
        margin-right: 20px;
        font-weight: normal;
      }

      button {
        width: 100%;
        padding: 12px;
        background-color: #2563eb;
        color: white;
        border: none;
        border-radius: 5px;
        font-size: 16px;
        cursor: pointer;
      }

      button:hover {
        background-color: #1d4ed8;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h2>Đăng ký người dùng</h2>

      <form
        action="http://demo.codegym.vn/6/registration_form/register.php"
        method="POST"
      >
        <div class="form-group">
          <label for="name">Họ và tên:</label>
          <input
            type="text"
            id="name"
            name="name"
            placeholder="Nhập họ và tên"
            required
          />
        </div>

        <div class="form-group">
          <label for="email">Email:</label>
          <input
            type="email"
            id="email"
            name="email"
            placeholder="Nhập địa chỉ email"
            required
          />
        </div>

        <div class="form-group">
          <label for="phone">Số điện thoại:</label>
          <input
            type="tel"
            id="phone"
            name="phone"
            placeholder="Nhập số điện thoại"
            required
          />
        </div>

        <div class="form-group">
          <label>Giới tính:</label>
          <div class="gender">
            <label>
              <input type="radio" name="gender" value="male" required />
              Nam
            </label>
            <label>
              <input type="radio" name="gender" value="female" />
              Nữ
            </label>
          </div>
        </div>

        <button type="submit">Đăng ký</button>
      </form>
    </div>
  </body>
</html>
